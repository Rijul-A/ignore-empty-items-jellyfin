name: Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup CI tools
        uses: ./.github/actions/setup-ci

      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: |
          dotnet build Jellyfin.Plugin.IgnoreEmptyFolders/Jellyfin.Plugin.IgnoreEmptyFolders.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
      - name: Validate repository
        uses: ./.github/actions/validate
      - name: Generate meta.json
        run: |
          mkdir -p staging
          cp Jellyfin.Plugin.IgnoreEmptyFolders/bin/Release/net10.0/Jellyfin.Plugin.IgnoreEmptyFolders.dll staging/
          cp assets/icon.png staging/
          cat > staging/meta.json <<EOF
          {
            "guid": "f310dc1b-ea81-4cbc-bdc1-19f32a0542a8",
            "name": "Ignore Empty Items",
            "description": "Automatically hides or removes empty Jellyfin library items.",
            "overview": "Automatically hides or removes empty Jellyfin library items.",
            "owner": "Rijul-A",
            "category": "Library",
            "targetAbi": "12.0.0.0",
            "version": "${{ steps.version.outputs.VERSION }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "autoUpdate": true,
            "imagePath": "icon.png",
            "assemblies": ["Jellyfin.Plugin.IgnoreEmptyFolders.dll"]
          }
          EOF

      - name: Package release
        run: |
          cd staging
          zip -r ../ignore-empty-items-${{ steps.version.outputs.VERSION }}.zip .

      - name: Generate repository manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CHECKSUM=$(md5sum ignore-empty-items-${{ steps.version.outputs.VERSION }}.zip | cut -d' ' -f1)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SOURCE_PREFIX="https://github.com/${{ github.repository }}/releases/download"
            SOURCE_PATH="${{ github.ref_name }}/ignore-empty-items-${{ steps.version.outputs.VERSION }}.zip"
            SOURCE_URL="${SOURCE_PREFIX}/${SOURCE_PATH}"
          else
            SOURCE_URL=""
          fi
          cat > repository.json <<EOF
          [
            {
              "guid": "f310dc1b-ea81-4cbc-bdc1-19f32a0542a8",
              "name": "Ignore Empty Items",
              "description": "Automatically hides or removes empty Jellyfin library items.",
              "overview": "Automatically hides or removes empty Jellyfin library items.",
              "imageUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/icon.png",
              "owner": "Rijul-A",
              "category": "Library",
              "versions": [
                {
                  "version": "${{ steps.version.outputs.VERSION }}",
                  "changelog": "Release ${{ steps.version.outputs.VERSION }}",
                  "targetAbi": "12.0.0.0",
                  "sourceUrl": "${SOURCE_URL}",
                  "checksum": "${CHECKSUM}",
                  "timestamp": "${TIMESTAMP}"
                }
              ]
            }
          ]
          EOF
          # Tag pointers remain unchanged; history comes from published release assets, not Pages.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            set -euo pipefail
            manifest_dir=".release-manifests"
            mkdir -p "$manifest_dir"
            page=1
            while :; do
              releases=$(curl --fail --silent --show-error --location --retry 3 \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}")
              release_count=$(jq 'length' <<<"$releases")
              if (( release_count == 0 )); then
                break
              fi

              while IFS=$'\t' read -r release_id asset_url; do
                [[ -n "$release_id" && -n "$asset_url" ]] || continue
                curl --fail --silent --show-error --location --retry 3 \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/octet-stream" \
                  "$asset_url" > "$manifest_dir/${release_id}.json"
              done < <(
                jq -r '
                  .[]
                  | select(.draft == false and .published_at != null)
                  | . as $release
                  | .assets[]?
                  | select(.name == "repository.json")
                  | [$release.id, .url]
                  | @tsv
                ' <<<"$releases"
              )

              if (( release_count < 100 )); then
                break
              fi
              ((page += 1))
            done

            manifests=(repository.json)
            for previous_manifest in "$manifest_dir"/*.json; do
              [[ -f "$previous_manifest" ]] && manifests+=("$previous_manifest")
            done
            cat "${manifests[@]}" | jq -s '
              . as $manifests
              | ($manifests[0][0] // error("current repository manifest is empty")) as $plugin
              | (reduce ($manifests[]? | .[]? | .versions[]?) as $version
                  ({versions: [], seen: {}};
                   if (.seen[$version.version] // false)
                   then .
                   else .seen[$version.version] = true
                        | .versions += [$version]
                   end
                  )).versions as $versions
              | [$plugin | .versions = $versions]
            ' > repository.json.tmp
            mv repository.json.tmp repository.json
          fi

      - name: Upload release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ignore-empty-items-${{ steps.version.outputs.VERSION }}.zip
            staging/meta.json
            repository.json

      - name: Upload pull request package
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ignore-empty-items-${{ steps.version.outputs.VERSION }}
          path: |
            ignore-empty-items-${{ steps.version.outputs.VERSION }}.zip
            staging/meta.json
            repository.json

      - name: Upload repository manifest for Pages
        uses: actions/upload-artifact@v4
        with:
          name: repository-manifest
          path: repository.json

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Ignore Empty Items ${{ needs.release.outputs.version }}
          generate_release_notes: true
          files: |
            ignore-empty-items-${{ needs.release.outputs.version }}.zip
            staging/meta.json
            repository.json

  deploy-pages:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository manifest
        uses: actions/download-artifact@v4
        with:
          name: repository-manifest

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
