name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup CI tools
        uses: ./.github/actions/setup-ci

      - name: Validate repository
        uses: ./.github/actions/validate
