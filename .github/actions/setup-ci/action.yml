name: Setup CI tools
description: Install the SDKs and linters used by repository CI

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24.x"

    - name: Install lint tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes shellcheck yamllint
        go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.0
        go install github.com/checkmake/checkmake/cmd/checkmake@v0.3.2
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        sudo install -m 0755 "$(go env GOPATH)/bin/shfmt" /usr/local/bin/shfmt
        sudo install -m 0755 "$(go env GOPATH)/bin/checkmake" /usr/local/bin/checkmake
        sudo install -m 0755 "$(go env GOPATH)/bin/actionlint" /usr/local/bin/actionlint
